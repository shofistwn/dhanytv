name: Auto Update Favorites Playlist

on:
  schedule:
    # 4x sehari: 00:30, 06:30, 12:30, 18:30 UTC (07:30, 13:30, 19:30, 01:30 WIB)
    - cron: '30 */6 * * *'
  push:
    paths:
      - 'dhanytv.m3u'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-favorites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Favorites Playlist
        run: |
          echo "=== Generating Favorites Playlist ==="
          if [ ! -f "dhanytv.m3u" ]; then
            echo "ERROR: Master playlist dhanytv.m3u tidak ditemukan!"
            exit 1
          fi
          python3 update-script/generate_favorites.py --source dhanytv.m3u --output favorites.m3u --config update-script/favorites.txt

          if [ ! -s "favorites.m3u" ]; then
            echo "ERROR: File favorites.m3u gagal dihasilkan atau kosong!"
            exit 1
          fi
          FAV_COUNT=$(grep -c '#EXTINF' favorites.m3u || echo "0")
          echo "Favorites channels count: $FAV_COUNT"

      - name: Safety Gate
        run: |
          echo "=== Safety Gate: Verifikasi kelayakan favorites playlist ==="
          FAV_COUNT=$(grep -c '#EXTINF' favorites.m3u || echo "0")
          if [ "$FAV_COUNT" -lt 5 ]; then
            echo "ERROR: Channel favorit terlalu sedikit ($FAV_COUNT < 5). Abort tanpa commit."
            exit 1
          fi
          echo "Safety gate passed ($FAV_COUNT channels)."

      - name: Check for Changes
        id: check_changes
        run: |
          CHANGED_FILES=$(git status --porcelain -- favorites.m3u)
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES"
            git diff --stat favorites.m3u || true
          fi

      - name: Commit and Push Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add favorites.m3u
          COMMIT_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          FAV_COUNT=$(grep -c '#EXTINF' favorites.m3u 2>/dev/null || echo "0")
          git commit -m "auto-update: Favorites Playlist ($FAV_COUNT ch) - $COMMIT_DATE"
          git push

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "  Auto-Update Favorites Playlist"
          echo "============================================"
          echo "Tanggal   : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Channel   : $(grep -c '#EXTINF' favorites.m3u 2>/dev/null || echo 'N/A')"
          echo "Perubahan : ${{ steps.check_changes.outputs.has_changes }}"
          echo "============================================"
